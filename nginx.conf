worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        location = /index.html {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # EasyPanel routes clickpartsbrasil.com/click-midia to this service.
        # Vite publishes this prefix while files remain in the build's /assets directory.
        location ^~ /click-midia/assets/ {
            alias /usr/share/nginx/html/assets/;
            expires 6M;
            access_log off;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=15552000, immutable";
        }

        location = /click-midia/favicon.png {
            alias /usr/share/nginx/html/favicon.png;
            expires 6M;
            access_log off;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=15552000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:ico|css|js|woff|woff2|ttf|svg|jpg|jpeg|png|gif|webp|avif|webmanifest)$ {
            expires 6M;
            access_log off;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=15552000, immutable";
            try_files $uri =404;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }

        gzip on;
        gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;
        gzip_proxied any;
        gzip_min_length 256;
        gzip_vary on;

        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log warn;
    }
}
